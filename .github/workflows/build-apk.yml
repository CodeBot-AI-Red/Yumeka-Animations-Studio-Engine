name: Yumeka Animations Studio Engine - Build APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      release_type:
        description: 'Tipo de build'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Baixar Gradle Wrapper JAR
        run: |
          mkdir -p gradle/wrapper
          curl -fL -o gradle/wrapper/gradle-wrapper.jar \
            "https://services.gradle.org/distributions/gradle-8.7-wrapper.jar"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.kts', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Permissao gradlew
        run: chmod +x gradlew

      - name: Aceitar licencas SDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - name: Build APK Debug
        if: github.event_name != 'workflow_dispatch' || github.event.inputs.release_type == 'debug'
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Build APK Release
        if: github.event.inputs.release_type == 'release'
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Listar APKs gerados
        run: find . -name "*.apk" 2>/dev/null || echo "Nenhum APK encontrado"

      - name: Upload APK Debug
        if: success() && (github.event_name != 'workflow_dispatch' || github.event.inputs.release_type == 'debug')
        uses: actions/upload-artifact@v4
        with:
          name: yumeka-animations-debug-${{ github.sha }}
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Upload APK Release
        if: success() && github.event.inputs.release_type == 'release'
        uses: actions/upload-artifact@v4
        with:
          name: yumeka-animations-release-${{ github.sha }}
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 90
