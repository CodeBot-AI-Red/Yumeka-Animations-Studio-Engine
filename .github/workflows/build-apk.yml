name: Yumeka Anime Engine — Build APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      release_type:
        description: 'Tipo de build'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release

env:
  JAVA_VERSION: '17'
  ANDROID_COMPILE_SDK: '34'

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: 🔂️ Checkout codigo
        uses: actions/checkout@v4

      - name: ¯ Setup Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'

      - name: 🌿 Cache Gradle
        uses: actions/cache@v4
        with:
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.kradle.kts', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper

      - name: permissão gradlew
        run: chmod +x gradlew

      - name: 😈 Build APK Debug
        if: github.event_name != 'workflow_dispatch' || github.event.inputs.release_type == 'debug'
        run: ./gradlew :android:app:assembleDebug --stacktrace

      - name: 👄 Build APK Release (sem assinatura)
        if: github.event.inputs.release_type == 'release'
        run: ./gradlew :android:app:assembleRelease --stacktrace

      - name: permissão artefatos
        run: find . -name "*.apk"

      - name: 📦 Upload APK Debug
        if: github.event_name != 'workflow_dispatch' || github.event.inputs.release_type == 'debug'
        uses: actions/upload-artifact@v4
        with:
          name: yumeka-anime-engine-debug-apk-${{ github.sha }}
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: 👄 Upload APK Release
        if: github.event.inputs.release_type == 'release'
        uses: actions/upload-artifact@v4
        with:
          name: yumeka-anime-engine-release-apk-${{ github.sha }}
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 90

  summary:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: £ Sumario do Build
        run: |
          echo "# 🔃 Funcionou!" >> "GITHUBSTEP_SUMMARY"
          echo "" >> "$GITHUB_STEPSUmMARY"
          echo "| Campo | Valor |" >> "$GITHUB_STEPSUmMARY"
          echo "|---|---|" >> "$GITHUB_STEPSUMMARY"
          echo "| Repo | yumeka-animations-studio-engine |" >> "$GITHUB_STEPSUMMARY"
          echo "| Commit | ${{ github.sha }} |" >> "$GITHUB_STEPSUmMARY"
          echo "| Branch | ${{ github.ref_name }} |" >> "$GITHUB_STEPSUmMARY"
          echo "| Java | ${{ env.JAVA_VERSION }} |" >> "$GITHUB_STEPSUMMARY"
